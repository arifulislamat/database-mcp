[package]
name = "database-mcp-rs-postgres"
version = "0.2.1"
description = "MCP server for PostgreSQL with read-only guardrails, row caps, and statement timeouts"
readme = "README.md"
keywords = ["mcp", "ai", "postgres", "postgresql", "database"]
categories = ["database", "command-line-utilities"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# The command matches the npm and PyPI packages; only the crate name carries -rs.
[[bin]]
name = "database-mcp-postgres"
path = "src/main.rs"

[dependencies]
database-mcp-rs-core = { version = "0.1.1", path = "../../core/rust" }
# TLS via rustls with the ring provider and the Mozilla root store: no
# system OpenSSL needed, hosted Postgres (sslmode=require) works.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14"
webpki-roots = "1.0"
