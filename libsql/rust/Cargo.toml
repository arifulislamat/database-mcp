[package]
name = "database-mcp-rs-libsql"
version = "0.1.0"
description = "MCP server for libSQL/Turso (local files and remote databases) with read-only guardrails, row caps, and statement timeouts"
readme = "README.md"
keywords = ["mcp", "ai", "libsql", "turso", "sqlite"]
categories = ["database", "command-line-utilities"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# The command matches the npm and PyPI packages; only the crate name carries -rs.
[[bin]]
name = "database-mcp-libsql"
path = "src/main.rs"

[dependencies]
database-mcp-rs-core = { version = "0.1.0", path = "../../core/rust" }
# Local files and remote (Turso/sqld) only; no embedded-replica stack.
libsql = { version = "0.10", default-features = false, features = ["core", "remote", "tls"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
