# Cargo workspace for the Rust line. Coexists with the npm workspace
# (package.json) and the uv workspace (pyproject.toml); each language line
# has its own toolchain.
[workspace]
members = ["core/rust", "sqlite/rust", "libsql/rust", "mysql/rust", "mariadb/rust"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ariful Islam"]
repository = "https://github.com/arifulislamat/database-mcp"
homepage = "https://github.com/arifulislamat/database-mcp#readme"
rust-version = "1.85"
