[package]
name = "database-mcp-rs-sqlite"
version = "0.1.0"
description = "MCP server for SQLite with read-only guardrails, row caps, and statement timeouts"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "sqlite", "database", "sql"]
categories = ["database", "command-line-utilities"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# The command matches the npm and PyPI packages; only the crate name carries -rs.
[[bin]]
name = "database-mcp-sqlite"
path = "src/main.rs"

[dependencies]
database-mcp-rs-core = { version = "0.1.0", path = "../../core/rust" }
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
